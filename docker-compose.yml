# docker-compose.yml — run both frontend and backend with one command
# Usage: docker compose up --build
#
# For remote storage, set SUPABASE_URL and SUPABASE_KEY as env vars or in a .env file.
# The .env file is git-ignored. Example:
#   SUPABASE_URL=https://xxx.supabase.co
#   SUPABASE_KEY=your-key

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Uncomment and set for remote storage (or use a .env file):
      # - SUPABASE_URL=${SUPABASE_URL}
      # - SUPABASE_KEY=${SUPABASE_KEY}
      # - PDFTOOL_PUBLIC_URL=http://localhost:5000
    volumes:
      # Persist local output files across restarts (local storage mode only)
      - backend_outputs:/app/local_outputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_outputs:
